name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore MonoBank.Acquiring.slnx

      - name: Build
        run: dotnet build MonoBank.Acquiring.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MonoBank.Acquiring.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/MonoBank.Acquiring/MonoBank.Acquiring.csproj -c Release --no-build -o artifacts

      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/MonoBank.Acquiring/MonoBank.Acquiring.csproj \
            -c Release \
            -p:PackageVersion="$VERSION" \
            -o artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # nuget.org → Trusted Publishing policy must match:
      #   Owner: ConstantinOr   Repo: monobank-acquiring-dotnet
      #   Workflow: ci.yml      Environment: nuget
      #   Package glob: MonoBankAcquiring
      - name: NuGet login (OIDC → temp API key)
        id: nuget
        uses: NuGet/login@v1
        with:
          # nuget.org profile name (NOT email). Set repo Variable NUGET_USER.
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          if compgen -G "artifacts/*.snupkg" > /dev/null; then
            dotnet nuget push "artifacts/*.snupkg" \
              --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi
